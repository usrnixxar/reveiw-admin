<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skillence Review — Admin</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#241a38;background:#f5f3fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e8e2f1;padding:17px 5%;display:flex;justify-content:space-between;align-items:center}header strong{font-size:19px;color:#6534b8}button{border:0;border-radius:10px;background:#6734b4;color:#fff;padding:11px 17px;font:inherit;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#ede6f6;color:#573490}.container{max-width:1150px;margin:30px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e7e0ee;border-radius:17px;padding:24px;box-shadow:0 6px 25px #210c4a0a}#login{max-width:410px;margin:8vh auto}h1{font-size:27px;margin:0 0 8px}p{color:#756a87;font-size:14px}label{font-size:13px;font-weight:700;display:block;margin:16px 0 7px}input{display:block;width:100%;padding:12px;border:1px solid #d8cde5;border-radius:9px;font:inherit}#login button{width:100%;margin-top:20px}#dashboard[hidden],#login[hidden]{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{background:white;border:1px solid #e8e2f0;border-radius:14px;padding:18px}.stat b{font-size:28px;display:block;color:#612db2}.stat span{font-size:12px;color:#726780}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.toolbar input{max-width:280px}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:#6e617f;background:#f7f3fd}th,td{padding:13px 10px;border-bottom:1px solid #eee8f4;vertical-align:top}td{max-width:200px;overflow-wrap:anywhere}.scroll{overflow-x:auto}a{color:#6734b4}.map-box{width:190px;height:190px;background:#f5f1fc;border:1px solid #ddd0f0;border-radius:12px;display:grid;place-items:center;margin:8px 0;overflow:hidden}.map-box iframe{width:100%;height:100%;border:0}.muted{font-size:12px;color:#7a7188}.error{color:#a73430;font-size:13px}#notice{min-height:18px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.toolbar{flex-direction:column;align-items:stretch}.toolbar input{max-width:none}header{padding:15px}.container{margin:18px auto}.panel{padding:15px}}</style></head><body><header><strong>SKILLENCE <span style="color:#ea922c">REVIEW</span> / Admin</strong><button id="logout" class="secondary" hidden>Log out</button></header><div class="container"><section id="login" class="panel"><h1>Admin login</h1><p>Authorized Skillence Academy staff only.</p><form id="login-form"><label for="username">Admin email</label><input id="username" autocomplete="username" required placeholder="Authorized admin email"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in securely</button><p id="login-error" class="error" role="alert"></p></form></section><main id="dashboard" hidden><div class="toolbar"><div><h1>Student Reviews</h1><p>Private submissions and location details</p></div><input id="filter" type="search" placeholder="Search name, email or review" aria-label="Search submissions"></div><div class="stats"><div class="stat"><b id="count">0</b><span>Submitted reviews</span></div><div class="stat"><b id="average">—</b><span>Average /10</span></div><div class="stat"><b id="locations">0</b><span>Location shares</span></div></div><section class="panel"><div class="toolbar"><h2 style="margin:0;font-size:20px">All submissions</h2><button id="reload" class="secondary">Refresh</button></div><p id="notice" class="muted"></p><div class="scroll"><table><thead><tr><th>Date</th><th>Name / Email</th><th>Rating</th><th>Review / Comment</th><th>Attachment</th><th>Location</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script src="./config.js"></script><script>
const cfg=window.SKILLENCE_ADMIN_CONFIG||{};let token='',rows=[];const el=id=>document.getElementById(id);function setScreen(isIn){el('login').hidden=isIn;el('dashboard').hidden=!isIn;el('logout').hidden=!isIn}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function api(path,options={}){return fetch(cfg.url.replace(/\/$/,'')+path,{...options,headers:{apikey:cfg.anonKey,Authorization:'Bearer '+token,...(options.headers||{})}})}function formatDate(s){return s?new Date(s).toLocaleString('en-IN'):'—'}async function verifyAdmin(){const result=await api('/rest/v1/admin_users?select=user_id&limit=1');if(!result.ok)return false;return (await result.json()).length>0}function render(){const q=el('filter').value.trim().toLowerCase();const selected=rows.filter(x=>[x.student_name,x.email,x.review,x.comment].some(y=>String(y||'').toLowerCase().includes(q)));const tbody=el('rows');tbody.replaceChildren();for(const x of selected){const tr=document.createElement('tr');const td=v=>{const t=document.createElement('td');t.textContent=v||'—';tr.appendChild(t);return t};td(formatDate(x.created_at));td((x.student_name||'—')+'\n'+(x.email||''));td(x.rating?x.rating+'/5':'—');td((x.review||'')+'\n'+(x.comment||''));const fileTd=td('');if(x.attachment_path){const b=document.createElement('button');b.className='secondary';b.textContent='View file';b.onclick=()=>openFile(x.attachment_path);fileTd.appendChild(b)}else fileTd.textContent='—';const loc=td('');if(Number.isFinite(Number(x.latitude))&&Number.isFinite(Number(x.longitude))&&x.latitude!=null&&x.longitude!=null){const box=document.createElement('div');box.className='map-box';const frame=document.createElement('iframe');const lat=Number(x.latitude),lon=Number(x.longitude);const d=.004;frame.title='Submitted coordinates';frame.loading='lazy';frame.referrerPolicy='no-referrer';frame.src='https://www.openstreetmap.org/export/embed.html?bbox='+encodeURIComponent([lon-d,lat-d,lon+d,lat+d].join(','))+'&layer=mapnik&marker='+encodeURIComponent(lat+','+lon);box.appendChild(frame);loc.appendChild(box);const a=document.createElement('a');a.href='https://www.openstreetmap.org/?mlat='+encodeURIComponent(lat)+'&mlon='+encodeURIComponent(lon)+'#map=17/'+encodeURIComponent(lat)+'/'+encodeURIComponent(lon);a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open map';loc.appendChild(a);const info=document.createElement('p');info.className='muted';info.textContent=lat.toFixed(6)+', '+lon.toFixed(6)+(x.location_accuracy_meters?' · ±'+Math.round(x.location_accuracy_meters)+' m':'');loc.appendChild(info)}else loc.textContent='Not shared';tbody.appendChild(tr)}el('notice').textContent=selected.length+' reviews displayed.'}
async function openFile(path){if(!cfg.storageBucket)return;const result=await api('/storage/v1/object/sign/'+encodeURIComponent(cfg.storageBucket)+'/'+path.split('/').map(encodeURIComponent).join('/'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:60})});if(!result.ok){alert('File access denied');return}const data=await result.json();const signed=data.signedURL||data.signedUrl;if(signed)window.open(cfg.url.replace(/\/$/,'')+'/storage/v1'+signed,'_blank','noopener,noreferrer')}
async function loadRows(){el('notice').textContent='Loading reviews…';const r=await api('/rest/v1/skillence_reviews?select=*&order=created_at.desc&limit=500');if(!r.ok){el('notice').textContent='Could not load reviews. Check admin database permissions.';return}rows=await r.json();el('count').textContent=rows.length;const rated=rows.filter(x=>x.rating>=1&&x.rating<=5);el('average').textContent=rated.length?(rated.reduce((a,x)=>a+x.rating,0)/rated.length*2).toFixed(1):'—';el('locations').textContent=rows.filter(x=>x.latitude!=null&&x.longitude!=null).length;render()}
el('login-form').onsubmit=async e=>{e.preventDefault();el('login-error').textContent='';if(!cfg.url||!cfg.anonKey){el('login-error').textContent='Admin authentication is not configured.';return}try{const r=await fetch(cfg.url.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:cfg.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:el('username').value.trim(),password:el('password').value})});if(!r.ok)throw Error();const data=await r.json();token=data.access_token;if(!await verifyAdmin())throw Error();el('password').value='';setScreen(true);await loadRows()}catch{token='';el('login-error').textContent='Login unsuccessful. Please check your credentials.'}};el('logout').onclick=()=>{token='';rows=[];setScreen(false)};el('filter').oninput=render;el('reload').onclick=loadRows;
</script></body></html>
